# Builds the Go binary, runs its tests, and (on pushes to main) deploys to
# the target VM via the same Ansible playbook the Jenkinsfile uses.
# Mirrors Jenkinsfile stages: Test → Build → Deploy.

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Test
        run: go test main.go main_test.go

      - name: Build
        run: go build main.go

      # Deploy steps run only on pushes to main, not PRs.
      - name: Install Ansible
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      # Mirrors Jenkinsfile's `withCredentials([sshUserPrivateKey(...)])`:
      # loads the key into an ephemeral ssh-agent for the rest of the job.
      # Requires repo secret SSH_PRIVATE_KEY (Settings → Secrets → Actions).
      - name: Load SSH key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy with Ansible
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/deploy.yml
